<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta property="og:title" content="Join the Insider list. My Coach Kaj">
<meta property="og:image" content="https://mycoachkaj.com/img/share.jpg">

<body>
<title>Join the Insider list. My Coach Kaj</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#86587A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one question per screen in a narrow phone column. Sticky top bar holds back, progress, and the brand mark. Sticky bottom bar holds Continue. Single look: the site's plum, by choice, in every theme. */
:root{
  --plum:#86587A;
  --plum-deep:#5E3350;
  --plum-shade:#77496B;
  --cream:#FBF6F3;
  --cream-soft:#EBDDE5;
  --blush:#F2C6CF;
  --blush-hi:#F7D4DB;
  --ink:#4A2340;
  --line:rgba(251,246,243,.32);
  --tint:rgba(251,246,243,.07);
  --err:#FFE1A8;
  --display:"Gloock","Iowan Old Style",Georgia,serif;
  --body:"Figtree",-apple-system,"Segoe UI",Roboto,sans-serif;
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --page:#86587A;
  --page-clear:rgba(134,88,122,0);
  --field:#FBF6F3;
  --field-ink:#4A2340;
  --field-line:transparent;
  --panel:rgba(94,51,80,.45);
  color-scheme:dark;
}
/* Question screens: the site's colors flipped. Soft blush ground, deep plum text. Welcome screens keep the plum. */
html.light{
  --page:#FAEFF2;
  --page-clear:rgba(250,239,242,0);
  --cream:#4A2340;
  --cream-soft:#6A4A60;
  --blush:#86587A;
  --blush-hi:#77496B;
  --ink:#FBF6F3;
  --line:rgba(74,35,64,.2);
  --tint:#FFFFFF;
  --err:#A3304F;
  --field:#FFFFFF;
  --field-line:rgba(74,35,64,.22);
  --panel:#FFFFFF;
  color-scheme:light;
}
html.light .opt{box-shadow:0 1px 2px rgba(74,35,64,.06)}
html.light .mark span{color:#86587A}
.sheet{--cream:#FBF6F3;--cream-soft:#EBDDE5;--blush:#F2C6CF;--blush-hi:#F7D4DB;--ink:#4A2340;--line:rgba(251,246,243,.32);--tint:rgba(251,246,243,.07);color:var(--cream)}
html.light .tpill{background:#5E3350;color:#F2C6CF;border-color:#5E3350}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--page);height:100%;transition:background .3s ease}
body{margin:0;min-height:100%;background:var(--page);transition:background .3s ease,color .3s ease;color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--page)}
.app{min-height:100%;display:flex;flex-direction:column}
.col{width:100%;max-width:540px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--page)}
.top .col{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding-block:10px 8px}
.mark{font-family:var(--display);font-size:22px;text-align:center;line-height:1.1;white-space:nowrap;min-width:0}
.mark span{color:var(--blush)}
.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--cream);font-size:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--tint)}
.iconbtn[hidden]{display:none!important}
.bar{height:4px;background:rgba(251,246,243,.18);border-radius:999px;overflow:hidden;margin-bottom:2px}
.bar i{display:block;height:100%;width:0;background:var(--blush);border-radius:999px;transition:width .35s ease}

/* Step */
main{flex:1}
.step{padding-block:16px 20px;display:flex;flex-direction:column;gap:16px}
.step.enter{animation:rise .32s ease both}
@keyframes rise{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--blush);font-weight:500;margin:0}
h1{font-family:var(--display);font-weight:400;font-size:clamp(27px,7.4vw,34px);line-height:1.15;margin:0;text-wrap:balance;outline:none}
.hint{margin:-6px 0 0;color:var(--cream-soft);font-size:16px}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--cream-soft)}
.list li{display:flex;gap:10px;align-items:baseline}
.list li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--blush);transform:translateY(-2px)}

/* Choices */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--cream);background:var(--tint);
  border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;min-height:54px;transition:background .15s ease,border-color .15s ease,transform .1s ease}
.opt:hover{border-color:var(--cream-soft)}
.opt:active{transform:scale(.99)}
.opt[aria-checked="true"],.opt[aria-pressed="true"]{background:var(--blush);border-color:var(--blush);color:var(--ink)}
.tick{flex:0 0 22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.opt[aria-pressed="true"] .tick{background:var(--ink);border-color:var(--ink);color:var(--blush)}
.opt[aria-pressed="true"] .tick::before{content:"\2713"}
.opt.dim{opacity:.45}
.opts.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,9.5em),1fr));gap:8px}
.opts.two .opt{font-size:15px;line-height:1.25;padding:10px 12px;min-height:58px;border-radius:14px;gap:9px}
.opts.two .tick{flex-basis:18px;height:18px;border-radius:6px;font-size:12px}
.other{margin-top:-4px}
/* Welcome */
.welcome{padding-block:0 8px}
.hero{position:relative;margin-left:calc(-1 * var(--gl));margin-right:calc(-1 * var(--gr));height:min(60svh,600px);min-height:360px;overflow:hidden;background:var(--plum-shade)}
.hero img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(60,25,50,0) 30%,rgba(60,25,50,.55) 62%,rgba(134,88,122,.92) 90%,var(--plum) 100%)}
.hero .ov{position:absolute;left:var(--gl);right:var(--gr);bottom:14px;z-index:1;display:flex;flex-direction:column;gap:8px}
.hero .ov h1{font-size:clamp(30px,8.4vw,40px);line-height:1.08;text-shadow:0 2px 14px rgba(30,10,25,.5)}
.hero .ov .eyebrow{text-shadow:0 1px 8px rgba(30,10,25,.6)}
.hero .ov .sub{margin:0;font-family:var(--display);font-style:italic;letter-spacing:.01em;font-size:clamp(22px,6vw,26px);line-height:1.2;color:var(--blush);text-shadow:0 1px 10px rgba(30,10,25,.6)}
.hero.full .ov h1{font-size:clamp(44px,13vw,60px)}
.lede{margin:-4px 0 0;font-size:18px;color:var(--cream)}
.lede2{margin:-8px 0 0;font-size:16px;color:var(--cream-soft)}
.quote{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--blush)}
.quote blockquote{margin:0;font-family:var(--display);font-style:italic;font-size:21px;line-height:1.3;color:var(--blush)}
.quote figcaption{margin-top:4px;font-size:14px;color:var(--cream-soft)}
.join{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:18px;background:var(--tint)}
.join h2{margin:0;font-family:var(--display);font-weight:400;font-size:22px}
.hero.full{height:calc(100svh - 160px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));max-height:820px;min-height:420px}
.welcome2{padding-top:28px}
.welcome2 h1{font-size:clamp(28px,7.6vw,36px)}
.welcome2 .lede2{margin:2px 0 6px;font-family:var(--display);font-style:italic;font-size:clamp(23px,6.2vw,28px);line-height:1.22;color:var(--blush);text-wrap:balance}
@media (min-width:560px){.hero{margin-left:0;margin-right:0;border-radius:22px;margin-top:8px}.hero .ov{left:22px;right:22px}}
.count{font-size:14px;color:var(--blush);margin:-8px 0 0}

/* Fields */
label.fl{display:block;font-size:15px;font-weight:500;color:var(--cream-soft);margin-bottom:6px}
.field{display:flex;flex-direction:column;gap:6px}
input.in,select.in,textarea.in{width:100%;font:inherit;font-size:18px;color:var(--field-ink);background:var(--field);border:2px solid var(--field-line);border-radius:14px;padding:14px 16px;outline:none}
textarea.in{min-height:140px;resize:vertical;line-height:1.45;font-size:17px}
input.in:focus,select.in:focus,textarea.in:focus{border-color:var(--blush);box-shadow:0 0 0 3px rgba(242,198,207,.35)}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--field-ink) 50%),linear-gradient(135deg,var(--field-ink) 50%,transparent 50%);
  background-position:calc(100% - 22px) 52%,calc(100% - 16px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:44px}
.unit{display:flex;align-items:center;gap:10px}.unit .in{max-width:160px}.unit span{color:var(--cream-soft)}
.err{color:var(--err);font-size:15px;margin:0;min-height:0}
.err:empty{display:none}
.opt-group{display:flex;flex-direction:column;gap:14px;padding-top:6px;border-top:1px solid var(--line)}
.opt-group h2{font-family:var(--display);font-weight:400;font-size:22px;margin:6px 0 0}
.opt-group .hint{margin:0}

/* Consent */
.check{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--line);border-radius:16px;background:var(--tint);cursor:pointer;font-size:15px;line-height:1.45;color:var(--cream-soft)}
.check input{flex:0 0 22px;width:22px;height:22px;margin:1px 0 0;accent-color:var(--blush)}
.check b{color:var(--cream);font-weight:600}
.check a,.prose a{color:var(--blush);text-underline-offset:3px}
.req{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blush);display:block;margin-bottom:4px}

/* Buttons */
.dock{position:sticky;bottom:0;z-index:4;background:linear-gradient(180deg,var(--page-clear),var(--page) 28%)}
.dock .col{padding-block:18px calc(14px + env(safe-area-inset-bottom, 0px))}
.btn{display:block;width:100%;text-align:center;background:var(--blush);color:var(--ink);font:inherit;font-weight:600;font-size:18px;padding:16px 22px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;transition:background .15s ease,transform .1s ease}
.btn:hover{background:var(--blush-hi)}
.btn:active{transform:scale(.99)}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid var(--cream-soft)}
.btn.ghost:hover{background:var(--tint)}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
.small{font-size:14px;color:var(--cream-soft);text-align:center;margin:10px 0 0}

/* End and call screens */
.prose{display:flex;flex-direction:column;gap:14px;color:var(--cream-soft)}
.prose p{margin:0}
.prose .phone{font-family:var(--display);font-size:24px;color:var(--cream);letter-spacing:.01em}
.founding{border:1.5px solid var(--blush);border-radius:20px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;background:var(--panel)}
.founding h2{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.15;margin:0;color:var(--cream);text-wrap:balance}
.founding p{margin:0;color:var(--cream-soft)}
.alt{display:flex;flex-direction:column;gap:6px;text-align:center;padding-top:6px}
.alt h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.alt p{margin:0;color:var(--cream-soft);font-size:15px}
.big{font-family:var(--display);font-size:56px;line-height:1;color:var(--blush);margin:4px 0 0}
.big span{font-family:var(--body);font-size:16px;color:var(--cream-soft);margin-left:8px}

/* Preview test panel (only when no live endpoint is set) */
.tpill{position:fixed;z-index:30;right:calc(10px + env(safe-area-inset-right, 0px));top:calc(64px + env(safe-area-inset-top, 0px));font:600 12px var(--body);letter-spacing:.1em;text-transform:uppercase;
  background:var(--plum-deep);color:var(--blush);border:1px solid var(--blush);border-radius:999px;padding:7px 11px;cursor:pointer}
.panel{position:fixed;inset:0;z-index:40;background:rgba(30,10,25,.6);display:flex;align-items:flex-end;justify-content:center}
.panel[hidden]{display:none!important}
.sheet{width:100%;max-width:640px;max-height:88%;overflow:auto;background:var(--plum-deep);border-radius:22px 22px 0 0;
  padding:18px var(--gr) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gl);display:flex;flex-direction:column;gap:14px;font-size:15px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet h4{margin:4px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--blush);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--tint);border-radius:12px;padding:10px}
.kpi b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--cream-soft)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td{padding:5px 0;border-bottom:1px solid rgba(251,246,243,.12)}
.tbl td+td{text-align:right;color:var(--cream-soft)}
pre.json{margin:0;background:rgba(0,0,0,.22);border-radius:12px;padding:12px;overflow-x:auto;font-size:12px;line-height:1.45;color:var(--cream-soft);white-space:pre}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--blush);color:var(--ink);border-color:var(--blush)}
.row{display:flex;gap:8px}.row .btn{font-size:15px;padding:11px 14px}
.muted{color:var(--cream-soft);margin:0}
.testnote{margin:8px 0 0;padding:12px 14px;border-radius:12px;background:var(--tint);border:1px dashed var(--line);font-size:14px;color:var(--cream-soft)}

@media (prefers-reduced-motion:reduce){.step.enter{animation:none}.bar i{transition:none}}
</style>

<div class="app">
  <div class="top">
    <div class="col">
      <button class="iconbtn" id="back" aria-label="Back" hidden>&#8592;</button>
      <div class="mark">My Coach <span>Kaj</span></div>
      <span></span>
    </div>
    <div class="col"><div class="bar" aria-hidden="true"><i id="prog"></i></div></div>
  </div>
  <main><div class="col" id="stage" aria-live="polite"></div></main>
  <div class="dock" id="dock"><div class="col" id="dockin"></div></div>
</div>

<button class="tpill" id="tpill" hidden>Test panel</button>
<div class="panel" id="panel" hidden role="dialog" aria-modal="true" aria-labelledby="ptitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
(function(){
"use strict";

/* ===== Settings =====
   endpoint: the Caerus server address that receives a finished survey and the funnel counts.
   While it is empty, the page runs as a preview: nothing leaves the phone, and the test panel shows what would be sent. */
var CONFIG = {
  endpoint: "",
  bookingUrl: "",            // Zoom booking page for founder calls
  metaLead: false,           // one generic Lead signal on finish; stays off until the lawyer approves
  launchDate: "November 30",
  version: "survey_v1_2026-10-25",
  smsConsentVersion: "sms_consent_v1_2026-10-24",
  researchConsentVersion: "research_consent_v1_2026-10-24",
  site: "https://mycoachkaj.com"
};
var PREVIEW = !CONFIG.endpoint;
/* Welcome photo: coffee shop. Live site uses img/coffee.jpg. */
var HERO = "/img/coffee.jpg";

/* ===== Choices. Keys never change; wording can. ===== */
var C = {
  age:[["under_18","Under 18"],["18_39","18 to 39"],["40_49","40 to 49"],["50_59","50 to 59"],["60_69","60 to 69"],["70_plus","70 or older"]],
  tz:[["eastern","Eastern"],["central","Central"],["mountain","Mountain"],["arizona","Arizona"],["pacific","Pacific"],["alaska","Alaska"],["hawaii","Hawaii"]],
  safety:[["pregnant","I am pregnant."],["eating_disorder","I am being treated for an eating disorder, or have been in the last year."],["none","None of these."]],
  stage:[["not_started","Haven't started yet"],["taking","Taking it now"],["planning_stop","Planning to stop soon"],["stopped","Stopped taking it"]],
  months:(function(){var a=[["lt_1m","Less than a month"]];for(var i=1;i<=11;i++)a.push(["m"+i,i+(i===1?" month":" months")]);a.push(["y1","1 year"],["gt_1y","More than 1 year"],["gt_2y","More than 2 years"]);return a;})(),
  start:[["this_week","This week"],["two_weeks","Within two weeks"],["month","Within a month"],["not_sure","Not sure yet"]],
  med:[["wegovy","Wegovy"],["zepbound","Zepbound"],["ozempic","Ozempic"],["mounjaro","Mounjaro"],["compounded","A compounded version"],["pill","A pill"],["other","Other"],["not_sure","Not sure"]],
  day:[["mon","Monday"],["tue","Tuesday"],["wed","Wednesday"],["thu","Thursday"],["fri","Friday"],["sat","Saturday"],["sun","Sunday"],["varies","It changes week to week"]],
  side:[["nausea","Nausea"],["tiredness","Tiredness"],["stomach","Stomach trouble"],["low_appetite","Little or no appetite"],["heartburn","Heartburn"],["headaches","Headaches"],["hair_thinning","Hair thinning"],["none","None of these"]],
  struggle:[["regain_fear","Fear the weight comes back"],["guilt_voice","The old guilt voice around food"],["mirror","Getting used to the woman in the mirror"],["side_effect_days","Getting through side effect days"],["eating_enough","Eating enough when I'm not hungry"],["habits","Building habits that actually stick"],["strength","Getting stronger and more active"],["social","Eating out and social plans"],["alone","Feeling alone in this"],["other","Something else"]],
  noise:[["rarely","Rarely"],["some_days","Some days"],["most_days","Most days"],["almost_always","Almost all the time"]],
  trigger:[["sight_smell","Seeing or smelling food"],["stress","Stress or big feelings"],["tired","Being tired"],["boredom","Boredom"],["others_eating","Being around others eating"],["time_of_day","Certain times of day"],["nothing","Nothing much"]],
  win:[["energy","More energy"],["sleep","Better sleep"],["strong","Feeling strong in my body"],["muscle","Keeping my muscle"],["confidence","Confidence in how I look"],["calm_food","Calm around food"],["keep_up","Keeping up with the people I love"],["myself","Feeling like myself again"]],
  help:[["kind_word","A kind word first"],["straight","A straight answer, no fluff"],["small_step","A small next step I can take now"],["why","A reminder of why I started"],["vent","Room to vent before any advice"]],
  checkin:[["early_morning","Early morning, 6 to 8 a.m."],["morning","Morning, 8 to 11 a.m."],["midday","Midday, 11 a.m. to 2 p.m."],["afternoon","Afternoon, 2 to 5 p.m."],["evening","Evening, 5 to 8 p.m."]],
  bg:[["black","Black or African American"],["hispanic","Hispanic or Latina"],["white","White"],["asian","Asian"],["native_american","Native American or Alaska Native"],["pacific_islander","Native Hawaiian or Pacific Islander"],["mena","Middle Eastern or North African"],["describe","Let me describe it"],["prefer_not","Prefer not to say"]],
  heard:[["instagram","Instagram"],["facebook","Facebook"],["tiktok","TikTok"],["google","Google search"],["other","Something else"],["referral","Someone referred me"]]
};
var SMS_TEXT = "Yes, text me. I agree to receive coaching texts from My Coach Kaj, including automated texts, at the mobile number above. Message frequency varies. Message and data rates may apply. Reply STOP to stop or HELP for help. Consent is not a condition of any purchase. See our Texting Terms and Privacy Policy.";
var RESEARCH_TEXT = "I understand that My Coach Kaj may use my survey answers and coaching conversations, with my name and number removed, for research. Findings are only ever shared as group results, never individual ones. See our Privacy Policy.";

/* ===== State. Lives only in this page until she finishes. ===== */
var A = {}, P = {};          // A: survey answers. P: optional company data, kept apart.
function blank(){ A = {}; P = {}; }
function has(k){ return A[k] != null && A[k] !== "" && !(Array.isArray(A[k]) && !A[k].length); }
var stageIs = function(){ var s=[].slice.call(arguments); return s.indexOf(A.stage) > -1; };

/* ===== Steps, in screen order ===== */
var STEPS = [
  {id:"intro", kind:"intro"},
  {id:"intro2", kind:"intro2"},
  {id:"first_name", part:"About you", kind:"text", q:"What's your first name?", key:"first_name", ac:"given-name", req:true, max:40},
  {id:"phone", part:"About you", kind:"phone", q:"What's your mobile number?", hint:"Kaj coaches by text. US numbers only.", key:"phone"},
  {id:"email", part:"About you", kind:"email", q:"What's your email?", hint:"For your invitation and launch news.", key:"email"},
  {id:"age", part:"About you", kind:"single", q:"What's your age range?", key:"age_range", opts:C.age},

function multiBox(el, list, cur, only, max, e){
  var box=optsBox(list.length); el.appendChild(box);

    [].forEach.call(box.children,function(b){

      b.classList.toggle("dim", !on && cur.length>=max && only.indexOf(k)<0);
    });
    if(box.onpaint) box.onpaint();
  }
  list.forEach(function(o){
    var b=document.createElement("button"); b.type="button"; b.className="opt"; b.setAttribute("data-k",o[0]);
    b.innerHTML='<span class="tick" aria-hidden="true"></span><span>'+esc(o[1])+'</span>';
    b.addEventListener("click",function(){
      if(e) e.textContent="";
      var k=o[0], i=cur.indexOf(k);
      if(i>-1){ cur.splice(i,1); }
      else if(only.indexOf(k)>-1){ cur.length=0; cur.push(k); }
      else {
        for(var j=cur.length-1;j>=0;j--) if(only.indexOf(cur[j])>-1) cur.splice(j,1);
        if(cur.length>=max){ if(e) e.textContent = max===2 ? "You can pick two. Tap one to change it." : "That's the most you can pick."; return; }
        cur.push(k);

    box.appendChild(b);

}

  if(!PREVIEW){
    fetch(CONFIG.endpoint+"/survey",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(LAST)})
      .then(function(r){ if(!r.ok) throw new Error(r.status); })
      .catch(function(){ track("submit_failed"); });
  }
  if(CONFIG.metaLead && window.fbq){ try{ window.fbq("track","Lead"); }catch(e){} }   // generic, no answers
  callScreen();
}
function copyAnswers(){ var o={}; for(var k in A){ if(k!=="sms_consent" && k!=="research_consent") o[k]=Array.isArray(A[k])?A[k].slice():A[k]; } return o; }

function callScreen(){
  current={id:"call"}; history=[]; backBtn.hidden=true; prog.style.width="100%";
  stage.innerHTML='<section class="step enter">'+
    '<p class="eyebrow">You’re in</p><h1>You’re on the Insider list, '+name()+'. Kaj launches '+esc(CONFIG.launchDate)+'.</h1>'+
    '<p class="hint">One last choice.</p>'+
    '<div class="founding"><h2>Help shape Kaj. Become a Founding Insider.</h2>'+
      '<p>Thirty minutes with Kaj’s founder. Your story shapes what Kaj becomes for every woman after you.</p>'+
      '<p style="color:var(--cream);font-weight:600">Founding Insiders get:</p>'+
      '<ul class="list"><li>The first invites to join</li><li>A direct line to the founder</li><li>A vote on new features</li><li>Invitations to Founding Insider gatherings</li></ul>'+
      '<button class="btn" type="button" id="bookcall">Book my founder call</button></div>'+
    '<div class="alt"><h2>I’m ready to start.</h2><p>No call needed. We’ll email you as launch gets close.</p></div>'+
    '</section>';
  dockin.innerHTML=""; dock.hidden=false;
  cta("I’m ready to start", function(){ track("chose_ready"); doneScreen(false); }, {ghost:true});
  document.getElementById("bookcall").addEventListener("click",function(){
    track("chose_call");
    if(CONFIG.bookingUrl){ window.open(CONFIG.bookingUrl,"_blank","noopener"); }
    doneScreen(true);
  });
  window.scrollTo(0,0);
}
function doneScreen(call){
  current={id:"done"}; dock.hidden=true;
  var body = call
    ? '<h1>Thank you, '+name()+'.</h1><div class="prose"><p>'+(CONFIG.bookingUrl?'The booking page opened in a new tab. Pick any time that works for you.':'The booking page opens here once it\u2019s ready.')+'</p><p>Watch your email for the details.</p></div>'
    : '<h1>You’re all set, '+name()+'.</h1><div class="prose"><p>We’ll email you as launch gets close.</p></div>';
  if(PREVIEW) body += '<p class="testnote">We\u2019re testing this page. Nothing you entered was saved.</p>';
  stage.innerHTML='<section class="step enter">'+body+'</section>';
  window.scrollTo(0,0);
}

/* ===== Preview test panel ===== */
var pill=document.getElementById("tpill"), panel=document.getElementById("panel"), sheet=document.getElementById("sheet");
var ON_SITE = /(^|\.)mycoachkaj\.com$/i.test(location.hostname);
if(PREVIEW && (!ON_SITE || location.hash==="#test")){ pill.hidden=false; }
pill.addEventListener("click",function(){ drawPanel(); panel.hidden=false; });
panel.addEventListener("click",function(e){ if(e.target===panel) panel.hidden=true; });
document.addEventListener("keydown",function(e){ if(e.key==="Escape") panel.hidden=true; });
function drawPanel(){
  var n=function(ev){ return LOG.filter(function(e){return e.event===ev;}).length; };
  var times={}; LOG.forEach(function(e){ if(e.event==="step_time"){ times[e.step]=(times[e.step]||0)+e.ms; } });
  var last=null; LOG.forEach(function(e){ if(e.event==="step_view") last=e.step; });
  var rows=Object.keys(times).map(function(k){ return '<tr><td>'+esc(k)+'</td><td>'+(times[k]/1000).toFixed(1)+' s</td></tr>'; }).join("") || '<tr><td colspan="2" class="muted">Answer a question to see times.</td></tr>';
  sheet.innerHTML=
    '<h3 id="ptitle">Test panel</h3>'+
    '<p class="muted">Preview only. Nothing leaves this phone. Women never see this panel.</p>'+
    '<h4>Ad tag for this visit</h4><div class="chips" id="adchips">'+
      ["none","elena","simone","claire"].map(function(a){ var on=(AD||"none")===a; return '<button class="chip" type="button" data-ad="'+a+'" aria-pressed="'+on+'">'+a+'</button>'; }).join("")+'</div>'+
    '<h4>Funnel counts, this visit</h4><div class="kpis">'+
      '<div class="kpi"><b>'+n("started")+'</b><span>Started</span></div>'+
      '<div class="kpi"><b>'+n("finished")+'</b><span>Finished</span></div>'+
      '<div class="kpi"><b>'+(n("chose_call"))+'</b><span>Chose the call</span></div></div>'+
    '<p class="muted">Last question reached: <b style="color:var(--cream)">'+esc(last||"none yet")+'</b></p>'+
    '<h4>Time per question</h4><table class="tbl">'+rows+'</table>'+
    '<h4>What our database would receive</h4>'+
    (LAST?'<pre class="json">'+esc(JSON.stringify(LAST,null,2))+'</pre>':'<p class="muted">Finish the survey to see it. Kind end screens send nothing.</p>')+
    '<h4>Funnel events sent ('+LOG.length+')</h4><pre class="json">'+esc(LOG.map(function(e){ return [e.event,e.step||"",e.ms!=null?e.ms+"ms":"",e.ad||""].join("  "); }).join("\n")||"none yet")+'</pre>'+
    '<div class="row"><button class="btn ghost" type="button" id="restart">Start over</button><button class="btn" type="button" id="pclose">Close</button></div>';
  [].forEach.call(sheet.querySelectorAll("[data-ad]"),function(b){ b.addEventListener("click",function(){ var a=b.getAttribute("data-ad"); AD = a==="none"?null:a; drawPanel(); }); });
  document.getElementById("pclose").addEventListener("click",function(){ panel.hidden=true; });
  document.getElementById("restart").addEventListener("click",function(){ blank(); history=[]; started=false; farthest=0; LAST=null; current=null; panel.hidden=true; show(STEPS[0]); track("survey_open"); });
}

/* ===== Go ===== */
track("survey_open");
show(STEPS[0]);
})();
</script>
